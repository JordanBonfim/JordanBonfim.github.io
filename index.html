
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mana & Bullets</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
            background: radial-gradient(circle at center, #252044 0%, #11101e 45%, #080810 100%);
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            color: #a99adf;
            letter-spacing: 8px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(55px, 10vw, 110px);
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 1;
            text-shadow: 0 0 30px #8055ff88;
        }

        h1 span {
            color: #a47aff;
        }

        .description {
            margin-top: 20px;
            color: #aaa5bd;
            font-size: 16px;
            letter-spacing: 2px;
        }

        /* Character animation */
        .character {
            width: 180px;
            height: 180px;
            object-fit: contain;
            image-rendering: pixelated;
            margin: 20px auto 0;
            display: block;
            filter: drop-shadow(0 0 20px #8055ff88);
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .play-button {
            margin-top: 35px;
            padding: 20px 75px;
            border: 2px solid #a47aff;
            background: linear-gradient(135deg, #7950d8, #45258e);
            color: white;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 0 25px #8055ff55;
        }

        .play-button:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, #a47aff, #6840bd);
            box-shadow: 0 0 45px #8055ffaa;
        }

        .footer {
            position: absolute;
            bottom: 25px;
            color: #57536a;
            font-size: 12px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <main class="container">
        <p class="subtitle">A Fantasy Survivor Game</p>

        <h1>MANA <span>&</span><br>BULLETS</h1>

        <p class="description">
            SURVIVE THE WAVES. MASTER THE MAGIC.
        </p>

        <img id="character" class="character" src="sprites/IDLE2.png" alt="Main Character">

        <button class="play-button"
            onclick="window.location.href='Mana%26Bullets.html'">
            ▶ JOGAR
        </button>
    </main>

    <footer class="footer">
        MANA & BULLETS © 2026
    </footer>

    <script>
        const frames = [
            "sprites/IDLE2.png",
            "sprites/IDLE3.png",
            "sprites/IDLE4.png",
            "sprites/IDLE5.png",
            "sprites/IDLE6.png",
            "sprites/IDLE7.png"
        ];

        const character = document.getElementById("character");

        let currentFrame = 0;

        setInterval(() => {
            currentFrame = (currentFrame + 1) % frames.length;
            character.src = frames[currentFrame];
        }, 150);
    </script>
</body>
</html>
